<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1310">
<meta name="robots" content="noindex">
<title>My incidents - PearlFox Service Desk</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="96x96" href="../favicon-96x96.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">
<link rel="manifest" href="../site.webmanifest">
<link rel="stylesheet" href="incidents.css">
</head>
<body>
<header id="topbar"></header>

<section class="welcome">
  <div class="wrap">
    <div>
      <h1 id="greeting"></h1>
      <p id="subline"></p>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search by number, description or system" aria-label="Search incidents" autocomplete="off">
    </div>
  </div>
</section>

<main class="wrap">
  <div class="cards" id="cards" role="group" aria-label="Summary"></div>

  <section class="panel" aria-label="Assigned to me">
    <div class="panel-head">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="head-actions">
        <span class="hint">Double-click an incident to open it</span>
        <button type="button" class="btn-primary" id="newBtn" aria-haspopup="dialog"><span class="plus" aria-hidden="true">+</span> New incident</button>
      </div>
    </div>
    <div class="toolbar">
      <label>Priority <select id="fPriority"></select></label>
      <label>Status <select id="fStatus"></select></label>
      <button class="btn-link" id="clear" type="button">Clear filters</button>
    </div>
    <div class="table-scroll">
      <table class="list">
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="table-foot" id="foot"></div>
  </section>
</main>
<footer id="sitefoot"></footer>

<script src="incidents-data.js"></script>
<script src="common.js"></script>
<script src="random-incident.js"></script>
<script src="create.js"></script>
<script src="landing.js"></script>
</body>
</html>
