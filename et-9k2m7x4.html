<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Do NOT index this page. Private internal tool, unlisted URL. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>PearlFox Partners Expenses Tracker</title>
<!--
    PearlFox Expenses Tracker (Supabase-backed)
    ============================================
    SETUP STEPS:
    1. Run supabase_setup.sql in your Supabase SQL editor.
    2. Create a single shared user under Authentication → Users.
    3. Fill in SUPABASE_URL and SUPABASE_ANON_KEY below (search for
       "REPLACE_ME"). The anon key is safe to expose; RLS enforces
       that only authenticated users can read/write data.
    4. Host this file on pearlfox.io as a static asset.
-->
<style>
    /* =========================================================
       PearlFox Expenses Tracker — brand-aligned UI
       Uses the PearlFox palette (fox orange accents on pearl cream)
       ========================================================= */
    :root {
        /* Brand */
        --pearl-light: #FBF6EF;
        --pearl-cream: #F5DFC9;
        --pearl-warm:  #EDC9A9;
        --pearl-deep:  #C98F63;
        --fox-bright:  #FFB245;
        --fox-orange:  #FC8215;
        --fox-amber:   #F45A08;
        --fox-deep:    #D92802;
        --fox-dark:    #8A1204;

        /* Semantic */
        --bg:          var(--pearl-light);
        --surface:     #FFFFFF;
        --surface-alt: #FCF9F4;
        --text:        #1A1310;
        --text-muted:  #5A4E44;
        --border:      rgba(20,10,0,0.10);
        --border-strong: rgba(20,10,0,0.22);
        --success:     #1f7a3a;
        --success-dark:#145c2a;
        --danger:      var(--fox-dark);
        --lock-red:      #C62828;
        --lock-red-dark: #A31F1F;

        --shadow-sm: 0 1px 2px rgba(20,10,0,0.06);
        --shadow-md: 0 4px 12px rgba(20,10,0,0.08);
        --shadow-lg: 0 12px 32px rgba(20,10,0,0.15);

        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;

        --fox-gradient: linear-gradient(135deg, var(--fox-bright), var(--fox-amber));
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        color: var(--text);
        background: var(--bg);
        font-size: 14px;
    }
    body { overflow: hidden; }

    :root {
        --util-w: 360px;                                   /* Utilization box */
        --page-w: calc(1082px + var(--util-w) + 12px);    /* table (1080) + borders + box + gap */
    }
    .container {
        width: 100%;
        max-width: var(--page-w);
        margin: 0 auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 16px 0 12px;
        gap: 10px;
    }

    h1 {
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.3px;
        margin: 0;
        padding: 6px 0 2px;
        flex-shrink: 0;
        color: var(--text);
    }
    h1::after {
        content: "";
        display: block;
        width: 48px;
        height: 3px;
        background: var(--fox-gradient);
        border-radius: 2px;
        margin: 6px auto 0;
    }

    /* Toolbar */
    .toolbar {
        padding: 0 0 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 100%;
        max-width: calc(var(--page-w) - 2px);
        margin: 0 auto;
    }
    .toolbar button {
        font: inherit;
        font-size: 13px;
        padding: 7px 14px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        border-radius: var(--radius-md);
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
    }
    .toolbar button:hover {
        background: var(--pearl-cream);
        border-color: var(--pearl-deep);
    }
    .toolbar button:active { transform: translateY(1px); }
    .toolbar .spacer { flex: 1; }
    .toolbar .status {
        font-size: 12px;
        color: var(--text-muted);
        font-style: italic;
    }

    /* Tabs (Expenses / Investments) */
    .tabs {
        display: flex;
        justify-content: center;
        gap: 6px;
        flex-shrink: 0;
    }
    .tab-btn {
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.3px;
        padding: 8px 24px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text-muted);
        cursor: pointer;
        border-radius: var(--radius-md);
        transition: background 0.15s ease, color 0.15s ease, transform 0.05s ease;
    }
    .tab-btn:hover { background: var(--pearl-cream); color: var(--text); }
    .tab-btn:active { transform: translateY(1px); }
    .tab-btn.active {
        background: var(--fox-gradient);
        border-color: transparent;
        color: #1A0E04;
        box-shadow: var(--shadow-sm);
    }

    /* One .view per tab; the hidden one takes no space */
    .view {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .view[hidden] { display: none; }

    /* Table container */
    .table-wrap {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow-sm);
    }

    /* Utilization box on the left, main table next to it */
    .view-main {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        gap: 12px;
        align-items: stretch;
    }
    .view-main.centered { justify-content: center; }
    .view-main .table-wrap { min-width: 0; }

    /* Investments table: compact. Width = sum of its columns
       (46 + 120 + 180 + 120 + 64). */
    .table-wrap.narrow { flex: 0 1 auto; max-width: 100%; }
    .table-wrap.narrow table { width: 530px; min-width: 530px; }

    /* Utilization summary (same box on both tabs, cloned from #util-template) */
    .util-box {
        flex: 0 0 auto;
        align-self: flex-start;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
    }
    .util-box { width: var(--util-w); }
    .util-table { width: 100%; min-width: 0; margin: 0; }
    .util-table th, .util-table td { height: 32px; white-space: nowrap; }
    .util-table thead th { position: static; }
    .util-table th.util-title { font-size: 13px; letter-spacing: 1px; }
    .util-table td.util-label { text-align: left; font-weight: 600; padding: 10px 18px 10px 12px; }
    .util-table td.util-num   { text-align: right; padding-right: 12px; }
    .util-table td.negative   { color: var(--lock-red); font-weight: 700; }
    .util-table tbody tr:last-child td { background: var(--pearl-cream); font-weight: 700; border-top: 2px solid var(--pearl-deep); }

    table {
        width: 1080px;
        min-width: 1080px;
        table-layout: fixed;
        border-collapse: separate;
        border-spacing: 0;
        background: var(--surface);
        margin: 0 auto;
        font-size: 13px;
    }

    th, td {
        border-right: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        padding: 10px 8px;
        height: 32px;
        background: var(--surface);
    }
    th:last-child, td:last-child { border-right: none; }
    tbody tr:last-child td { border-bottom: none; }

    thead th {
        background: var(--pearl-cream);
        color: var(--text);
        text-align: center;
        vertical-align: middle;
        font-weight: 700;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        position: sticky;
        top: 0;
        z-index: 90;
        border-bottom: 2px solid var(--pearl-deep);
    }
    thead th.sortable { cursor: pointer; user-select: none; transition: background 0.12s; }
    thead th.sortable:hover { background: var(--pearl-warm); }
    thead th .sort-arrow {
        display: inline-block;
        width: 10px;
        color: var(--fox-orange);
        font-weight: bold;
    }

    /* Zebra striping (class set by JS, because month header rows sit between data rows) */
    tbody tr.alt td { background: var(--surface-alt); }
    tbody tr:hover td { background: #FFF6E9; }

    /* Month section header: label on the left, month subtotals under their columns */
    tbody tr.month-row td,
    tbody tr.month-row:hover td {
        background: var(--pearl-warm);
        color: var(--text);
        font-weight: 700;
        font-size: 13px;
        border-top: 2px solid var(--pearl-deep);
        border-bottom: 1px solid var(--pearl-deep);
    }
    tbody tr.month-row td.month-label { text-align: left; padding-left: 14px; letter-spacing: 0.3px; }
    tbody tr.month-row td.month-sum   { text-align: right; }   /* default cell padding = same right edge as the rows */

    tfoot td {
        background: var(--pearl-cream);
        color: var(--text);
        font-weight: 700;
        text-align: center;
        position: sticky;
        bottom: 0;
        z-index: 80;
        border-top: 2px solid var(--pearl-deep);
        font-size: 13px;
    }

    input[type="date"] {
        width: 100%;
        border: none;
        background: transparent;
        font: inherit;
        color: var(--text);
        cursor: pointer;
        outline: none;
    }

    td[contenteditable="true"] { outline: none; transition: background 0.12s; }
    td[contenteditable="true"]:focus {
        background: #FFF3D6 !important;
        box-shadow: inset 0 0 0 2px var(--fox-bright);
    }

    /* Column widths */
    /* Column widths apply to both th and td (fixed layout).
       IMPORTANT: sum must equal the table's declared width so the
       last column isn't clipped.
       46 + 120 + 210 + 120 + 110 + 130 + 130 + 150 + 64 = 1080 */
    .sno         { width: 46px;  }
    .date        { width: 120px; }
    .description { width: 210px; }
    .expense     { width: 120px; }
    .share       { width: 110px; }
    .person      { width: 130px; }
    .remark      { width: 150px; }
    .receipt     { width: 64px;  }
    .row-actions { width: 64px;  }
    .inv-name    { width: 180px; }

    thead th   { text-align: center; }
    td.sno     { text-align: center; color: var(--text-muted); font-weight: 600; }
    td.date    { text-align: center; }
    td.expense { text-align: right; font-variant-numeric: tabular-nums; }
    td.share   { text-align: center; }
    td.person  { text-align: center; font-variant-numeric: tabular-nums; }
    td.receipt { text-align: center; }
    td.row-actions { text-align: center; }

    .person-cell {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
    }
    /* Checkbox at the left, amount flush right: every amount, month subtotal
       and grand total in a person column ends on the same right edge. */
    .person-amount { flex: 1; min-width: 55px; text-align: right; }
    .paid-check    { width: 16px; height: 16px; cursor: pointer; accent-color: var(--success); }
    .person-cell.checked { color: var(--success-dark); font-weight: 700; }
    .person-cell.checked .person-amount { color: var(--success-dark); }

    .inv-name .share-select { text-align: left; }
    .share-select {
        width: 100%;
        border: none;
        background: transparent;
        font: inherit;
        color: var(--text);
        cursor: pointer;
        outline: none;
        text-align: center;
    }

    /* Receipt buttons */
    .receipt-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
    }
    .receipt-btn {
        background: transparent;
        border: 1px solid var(--border-strong);
        cursor: pointer;
        font-size: 10px;
        padding: 3px 8px;
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 700;
        transition: all 0.15s;
    }
    .receipt-btn:hover {
        background: var(--pearl-cream);
        color: var(--text);
    }
    .receipt-btn.has-file {
        color: white;
        background: var(--fox-gradient);
        border-color: transparent;
        box-shadow: var(--shadow-sm);
    }
    .receipt-btn.has-file:hover { filter: brightness(1.05); }
    .receipt-remove,
    .row-delete {
        color: var(--danger);
        background: transparent;
        border: none;
        font-size: 14px;
        padding: 0 4px;
        cursor: pointer;
        border-radius: 3px;
    }
    .receipt-remove:hover,
    .row-delete:hover { background: rgba(217,40,2,0.1); }

    .empty-row td {
        text-align: center;
        color: var(--text-muted);
        font-style: italic;
    }

    .footer-label { text-align: right; padding-right: 12px; }
    .footer-total, td.person.footer-total { text-align: right; }

    /* ---- Login screen ---- */
    .login {
        position: fixed;
        inset: 0;
        background:
            radial-gradient(ellipse at top left,  rgba(255,178,69,0.18), transparent 55%),
            radial-gradient(ellipse at bottom right, rgba(252,130,21,0.15), transparent 55%),
            var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 20px;
    }
    .login-box {
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 36px 32px 28px;
        width: 340px;
        max-width: 100%;
        text-align: center;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        position: relative;
    }
    .login-box::before {
        content: "";
        position: absolute;
        top: 0; left: 24px; right: 24px;
        height: 3px;
        background: var(--fox-gradient);
        border-radius: 0 0 4px 4px;
    }
    .login-box h2 {
        margin: 0 0 20px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.3px;
        color: var(--text);
    }
    .login-box input {
        width: 100%;
        padding: 12px 14px;
        margin: 6px 0 8px;
        font: inherit;
        font-size: 14px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--surface);
        color: var(--text);
        transition: border-color 0.15s, box-shadow 0.15s;
    }
    .login-box input:focus {
        outline: none;
        border-color: var(--fox-orange);
        box-shadow: 0 0 0 3px rgba(252,130,21,0.18);
    }
    .login-box button {
        width: 100%;
        padding: 11px 20px;
        margin-top: 12px;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.3px;
        color: #1A0E04;
        background: var(--fox-gradient);
        border: none;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        transition: transform 0.05s, filter 0.15s;
    }
    .login-box button:hover:not(:disabled) { filter: brightness(1.05); }
    .login-box button:active { transform: translateY(1px); }
    .login-box button:disabled { opacity: 0.55; cursor: wait; }

    .error {
        color: var(--danger);
        font-size: 13px;
        min-height: 18px;
        margin-top: 8px;
    }

    #app { display: none; width: 100%; height: 100vh; }
    #app.ready { display: block; }

    /* Add-row bar */
    .add-row-bar {
        flex-shrink: 0;
        padding: 8px 0 4px;
        display: flex;
        justify-content: center;
    }
    .add-row-bar button {
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.3px;
        padding: 9px 22px;
        border: none;
        background: var(--fox-gradient);
        color: #1A0E04;
        cursor: pointer;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        transition: transform 0.05s, filter 0.15s;
    }
    .add-row-bar button:hover:not(:disabled) { filter: brightness(1.05); }
    .add-row-bar button:active:not(:disabled) { transform: translateY(1px); }
    .add-row-bar button:disabled {
        cursor: not-allowed;
        background: var(--pearl-warm);
        color: var(--text);
    }

    /* Lock button unlocked-state accent (in toolbar).
       Base .toolbar button styles cover everything else. */
    /* Lock status: green = locked (safe), red = unlocked (editable).
       Prefixed with .toolbar so these beat the generic toolbar-button
       hover; the .unlocked rules come last so they win over locked. */
    .toolbar .lock-btn {
        background: var(--success);
        border-color: transparent;
        color: #fff;
        font-weight: 700;
    }
    .toolbar .lock-btn:hover {
        background: var(--success-dark);
        border-color: transparent;
    }
    .toolbar .lock-btn.unlocked { background: var(--lock-red); }
    .toolbar .lock-btn.unlocked:hover { background: var(--lock-red-dark); }

    /* Locked-state: only change cursor, keep text/colors fully readable */
    body.table-locked #btn-add,
    body.table-locked #btn-add-invest,
    body.table-locked .paid-check,
    body.table-locked .share-select,
    body.table-locked input[type="date"] {
        cursor: not-allowed;
    }

    /* Locked-state receipt cell: hide "add" button (dead action) and
       hide "×" remove button (can't remove while locked). "View" button
       (.has-file) stays visible and clickable so attachments remain
       downloadable in locked mode. */
    body.table-locked .receipt-btn:not(.has-file),
    body.table-locked .receipt-remove,
    body.table-locked .row-delete {
        display: none;
    }
    body.table-locked .receipt-btn.has-file {
        cursor: pointer;
    }

    /* Defeat browser's default washed-out styling on disabled form
       controls so cell values (dates, share choices, etc.) stay crisp
       and legible while the tracker is locked. */
    #expenseBody select:disabled,
    #expenseBody input:disabled,
    #investBody select:disabled,
    #investBody input:disabled {
        opacity: 1;
        color: var(--text);
        -webkit-text-fill-color: var(--text);
        background: transparent;
    }
    /* Paid tick: drawn by hand so it is green whether the table is locked
       (disabled) or unlocked. Browsers grey out disabled native checkboxes
       and ignore accent-color there. */
    #expenseBody input.paid-check,
    #expenseBody input.paid-check:disabled {
        -webkit-appearance: none;
        appearance: none;
        opacity: 1;
        width: 16px;
        height: 16px;
        flex: none;
        margin: 0;
        border: 1.5px solid #bdbdbd;
        border-radius: 4px;
        background: #fff;
        position: relative;
    }
    #expenseBody input.paid-check:checked,
    #expenseBody input.paid-check:checked:disabled {
        background: var(--success);
        border-color: var(--success);
    }
    #expenseBody input.paid-check:checked::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 0.5px;
        width: 4px;
        height: 9px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    /* Toast */
    .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(140%);
        background: var(--text);
        color: var(--pearl-light);
        padding: 12px 20px;
        border-radius: var(--radius-md);
        font-size: 13px;
        font-weight: 600;
        box-shadow: var(--shadow-lg);
        z-index: 500;
        transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
        max-width: 90vw;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--fox-dark); }
    .toast.success { background: var(--success); }

    /* Loading overlay */
    .loading {
        position: fixed;
        inset: 0;
        background: rgba(251,246,239,0.85);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 900;
        font-size: 14px;
        color: var(--text-muted);
        font-weight: 600;
    }

    /* Config-error screen */
    .config-error {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 20px;
    }
    .config-error .box {
        background: var(--surface);
        border: 1px solid var(--fox-dark);
        border-top: 4px solid var(--fox-dark);
        padding: 28px 30px;
        max-width: 540px;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
    }
    .config-error h2 {
        color: var(--fox-dark);
        margin-top: 0;
        font-size: 20px;
        letter-spacing: -0.3px;
    }
    .config-error code {
        background: var(--pearl-cream);
        padding: 2px 7px;
        border-radius: 4px;
        font-size: 13px;
        font-family: "SF Mono", Menlo, Consolas, monospace;
        color: var(--fox-dark);
    }

    /* ============================================================
       MOBILE (< 780px): keep the same table structure as desktop.
       The .table-wrap already scrolls horizontally, so the full
       1080px-wide table remains reachable via horizontal swipe.
       Only surrounding chrome (padding, toolbar, header) gets tuned.
       ============================================================ */
    @media (max-width: 780px) {
        .container {
            padding: 12px 8px 8px;
            gap: 8px;
        }

        h1 { font-size: 20px; padding: 4px 0; }

        /* Toolbar: compact but keep single row */
        .toolbar {
            padding: 4px 0 6px;
            gap: 6px;
        }
        .toolbar button {
            padding: 6px 10px;
            font-size: 12px;
        }

        /* Table cells a touch smaller on mobile */
        th, td {
            padding: 8px 6px;
            font-size: 12px;
        }
        thead th {
            font-size: 11px;
            letter-spacing: 0.3px;
        }

        /* Utilization stacks above the table */
        .view-main { flex-direction: column; gap: 8px; }
        .view-main .util-box { align-self: stretch; width: auto; }

        /* Add-row: full-width easy tap target */
        .add-row-bar { padding: 6px 0 4px; }
        .add-row-bar button { width: 100%; max-width: 320px; padding: 11px 20px; }

        /* Login screen tuning */
        .login-box { width: calc(100% - 24px); padding: 28px 22px 20px; }
    }

    /* Print */
    @media print {
        body, html { overflow: visible; background: white; }
        .container { padding: 0; height: auto; display: block; }
        .table-wrap { overflow: visible; border: none; box-shadow: none; border-radius: 0; }

<script>
"use strict";

// ============================================================
// CONFIG — fill these in before deploying
// ============================================================
const SUPABASE_URL      = "https://sbeltsxzciquslnqdunv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_VWYVGfp4m7RMfY-FliZYRw_ZYmA8Y9H";
// The Supabase user's email is hidden from the UI. Create a user in
// Supabase Auth with THIS email (and password "janaki"). Users only
// ever type the password on the login screen.
const LOGIN_EMAIL       = "pearlfox@local.app";

// ============================================================
// Constants
// ============================================================
const CURRENCY      = "₹";
const SHARE_OPTIONS = ["", "All", "Manoj", "Praveen"];
const INVEST_PEOPLE = ["Manoj", "Praveen"];   // choices in the Investments "Person Name" dropdown
const BUCKET        = "expense-receipts";
const SAVE_DEBOUNCE_MS = 500;
const DEFAULT_ROWS  = 30;   // auto-seeded on first load when DB is empty

// ============================================================
// Client init (with config-error guard)
// ============================================================
if (SUPABASE_URL.startsWith("REPLACE_ME") || SUPABASE_ANON_KEY.startsWith("REPLACE_ME")) {
    document.body.innerHTML = `
        <div class="config-error"><div class="box">
            <h2>Supabase not configured</h2>
            <p>Open this HTML file in a text editor and set:</p>
            <ul>
                <li><code>SUPABASE_URL</code> — your project's URL</li>
                <li><code>SUPABASE_ANON_KEY</code> — your project's anon public key</li>
            </ul>
            <p>Both are at <strong>Supabase Dashboard → Settings → API</strong>.</p>
            <p>Also run <code>supabase_setup.sql</code> in the SQL Editor and create a user in <strong>Authentication → Users</strong> with email <code>pearlfox@local.app</code> and password <code>janaki</code>.</p>
        </div></div>`;
    throw new Error("Supabase config missing");
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
});

// ============================================================
// State (in-memory mirror of DB rows for rendering)
// ============================================================
let rows = [];             // array of row objects (camelCase, id from DB)
let investments = [];      // Investments tab: { id, date, person, amount }
let activeTab = "expenses";
let sort = { key: null, dir: 1 };
let locked = true;

// Pending debounced saves per row+field
const pendingSaves = new Map();  // key: `${id}:${field}` → timeoutId

// ============================================================
// Utils
// ============================================================
function parseExpense(raw) {
    if (raw === null || raw === undefined) return null;
    const cleaned = String(raw).trim().replace(/[₹$,\s]/g, "");
    if (cleaned === "") return null;
    const n = parseFloat(cleaned);
    return isNaN(n) ? null : n;
}

// Money is always shown with two decimals (paise): 2362 -> "₹2,362.00"
const roundCents = (n) => Math.round(n * 100) / 100;

function formatMoney(n) {
    if (n === null || n === undefined || isNaN(n)) return "";
    return CURRENCY + n.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
const ZERO_MONEY = formatMoney(0);   // "₹0.00" fallback for empty totals

function computeAmounts(row) {
    const exp = row.expense;
    if (exp === null || exp === undefined) return { manoj: 0, praveen: 0 };
    if (row.share === "All")     return { manoj: exp / 2, praveen: exp / 2 };
    if (row.share === "Manoj")   return { manoj: exp,     praveen: 0 };
    if (row.share === "Praveen") return { manoj: 0,       praveen: exp };
    return { manoj: 0, praveen: 0 };
}

// DB → client shape
function fromDb(r) {
    return {
        id:          r.id,
        date:        r.row_date || "",
        description: r.description || "",
        expense:     r.expense === null ? null : Number(r.expense),
        share:       r.share || "",
        manojPaid:   !!r.manoj_paid,
        praveenPaid: !!r.praveen_paid,
        remark:      r.remark || "",
        receiptPath: r.receipt_path || null,
        receiptName: r.receipt_name || null,
        sortOrder:   r.sort_order || 0
    };
}

// Client field name → DB column name
const FIELD_TO_COL = {
    date:        "row_date",
    description: "description",
    expense:     "expense",
    share:       "share",
    manojPaid:   "manoj_paid",
    praveenPaid: "praveen_paid",
    remark:      "remark",
    receiptPath: "receipt_path",
    receiptName: "receipt_name",
    sortOrder:   "sort_order"
};

// Each tab persists to its own table. A "store" tells the shared save
// helpers which table to hit and how client fields map to its columns.
const EXPENSE_STORE = { table: "expenses",    cols: FIELD_TO_COL };
const INVEST_STORE  = { table: "investments", cols: {
    date:   "invest_date",
    person: "person_name",
    amount: "amount"
}};

function toDbPatch(patch, cols) {
    const dbPatch = {};
    for (const [k, v] of Object.entries(patch)) {
        if (cols[k]) dbPatch[cols[k]] = v;
    }
    return dbPatch;
}

// ============================================================
// Toast + status
// ============================================================
let toastTimer = null;
function toast(msg, kind) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "toast show" + (kind ? " " + kind : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 3500);
}

let statusTimer = null;
function setStatus(msg) {
    const el = document.getElementById("status");
    if (!el) return;
    el.textContent = msg;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { el.textContent = ""; }, 1500);
}

function showLoading(show) {
    document.getElementById("loading").style.display = show ? "flex" : "none";
}

// ============================================================
// Data access — Supabase
// ============================================================
async function fetchRows() {
    const { data, error } = await sb
        .from("expenses")
        .select("*")
        .order("sort_order", { ascending: true })
        .order("created_at", { ascending: true });
    if (error) throw error;
    return (data || []).map(fromDb);
}

// Bulk-insert N blank rows. Used to seed the sheet on first load.
async function seedDefaultRows(n) {
    const blanks = [];
    for (let i = 0; i < n; i++) {
        blanks.push({
            row_date: null,
            description: "",
            expense: null,
            share: "",
            manoj_paid: false,
            praveen_paid: false,
            remark: "",
            sort_order: i + 1
        });
    }
    const { error } = await sb.from("expenses").insert(blanks);
    if (error) throw error;
}

async function insertRow(patch) {
    const dbPatch = toDbPatch(patch, FIELD_TO_COL);
    // Set sort_order = max + 1
    const maxOrder = rows.reduce((m, r) => Math.max(m, r.sortOrder || 0), 0);
    dbPatch.sort_order = maxOrder + 1;

    const { data, error } = await sb
        .from("expenses")
        .insert(dbPatch)
        .select()
        .single();
    if (error) throw error;
    return fromDb(data);
}

async function updateRowInDb(id, patch, store = EXPENSE_STORE) {
    const dbPatch = toDbPatch(patch, store.cols);
    if (Object.keys(dbPatch).length === 0) return;
    const { error } = await sb.from(store.table).update(dbPatch).eq("id", id);
    if (error) throw error;
}

// Debounced update — text fields fire many events per keystroke
function scheduleSave(id, field, value, store = EXPENSE_STORE) {
    const key = `${id}:${field}`;
    clearTimeout(pendingSaves.get(key));
    const t = setTimeout(async () => {
        pendingSaves.delete(key);
        try {
            await updateRowInDb(id, { [field]: value }, store);
            setStatus("Saved");
        } catch (e) {
            toast("Save failed: " + e.message, "error");
        }
    }, SAVE_DEBOUNCE_MS);
    pendingSaves.set(key, t);
}

// Immediate save (checkboxes, selects)
async function saveNow(id, field, value, store = EXPENSE_STORE) {
    try {
        await updateRowInDb(id, { [field]: value }, store);
        setStatus("Saved");
    } catch (e) {
        toast("Save failed: " + e.message, "error");
    }
}

function getRow(id) { return rows.find(r => r.id === id); }

// ============================================================
// Utilization box (same numbers on both tabs)
//   Investment collected = Investments tab total per person
//   Utilized             = that person's share of expenses, ONLY where their
//                          own checkbox is ticked (unticked = not utilized yet)
//   Balance to utilize   = collected - utilized (negative shown red)
// ============================================================
function mountUtilization() {
    const tpl = document.getElementById("util-template");
    document.querySelectorAll(".util-slot").forEach(slot => {
        slot.replaceWith(tpl.content.cloneNode(true));
    });
}

function updateUtilization() {
    const invested = { Manoj: 0, Praveen: 0 };
    const utilized = { Manoj: 0, Praveen: 0 };
    investments.forEach(i => {
        if (Object.hasOwn(invested, i.person)) invested[i.person] += i.amount || 0;
    });
    rows.forEach(r => {
        const a = computeAmounts(r);
        if (r.manojPaid)   utilized.Manoj   += a.manoj;
        if (r.praveenPaid) utilized.Praveen += a.praveen;
    });
    document.querySelectorAll(".util-box [data-util]").forEach(td => {
        const p = td.dataset.person;
        const value = { invested: invested[p], utilized: utilized[p], balance: invested[p] - utilized[p] }[td.dataset.util];
        const cents = roundCents(value);
        td.textContent = (cents < 0 ? "-" : "") + formatMoney(Math.abs(cents));
        td.classList.toggle("negative", cents < 0);
    });
}

// ============================================================
// Month sections (shared by Expenses and Investments)
// ============================================================
const NO_DATE = "none";
const MONTH_FMT = new Intl.DateTimeFormat("en-US", { month: "long", year: "numeric" });

function monthKey(iso) { return /^\d{4}-\d{2}/.test(iso || "") ? iso.slice(0, 7) : NO_DATE; }

function monthLabel(key) {
    if (key === NO_DATE) return "No date";
    const [y, m] = key.split("-").map(Number);
    return MONTH_FMT.format(new Date(y, m - 1, 1));
}

// Oldest month first, undated rows last. Order inside a month is kept as given.
function groupByMonth(items) {
    const groups = new Map();
    items.forEach(it => {
        const k = monthKey(it.date);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(it);
    });
    return [...groups.keys()]
        .sort((a, b) => (a === NO_DATE) - (b === NO_DATE) || a.localeCompare(b))
        .map(key => ({ key, items: groups.get(key) }));
}

// spec = [[labelColspan], [colspan, sumName?], ...]; the first entry is the month label.
function monthHeaderRow(label, spec) {
    const tr = document.createElement("tr");
    tr.className = "month-row";
    spec.forEach(([span, sumName], i) => {
        const td = document.createElement("td");
        td.colSpan = span;
        if (i === 0) { td.className = "month-label"; td.textContent = label; }
        else if (sumName) { td.className = "month-sum"; td.dataset.sum = sumName; }
        tr.appendChild(td);
    });
    return tr;
}

function renderByMonth(tbody, items, makeRow, headerSpec) {
    tbody.innerHTML = "";
    let n = 0;
    groupByMonth(items).forEach(({ key, items: group }) => {
        const head = monthHeaderRow(monthLabel(key), headerSpec);
        head.dataset.month = key;
        tbody.appendChild(head);
        group.forEach(item => {
            const tr = makeRow(item, n);
            tr.dataset.month = key;
            tr.classList.toggle("alt", n % 2 === 1);
            tbody.appendChild(tr);
            n++;
        });
    });
}

// sums = { sumName: (itemsInThatMonth) => number }
function refreshMonthSums(tbody, items, sums) {
    tbody.querySelectorAll("tr.month-row").forEach(tr => {
        const inMonth = items.filter(it => monthKey(it.date) === tr.dataset.month);
        tr.querySelectorAll("[data-sum]").forEach(td => {
            td.textContent = formatMoney(sums[td.dataset.sum](inMonth)) || ZERO_MONEY;
        });
    });
}

// A date edited into another month moves the row to that month's section.
// Done on blur, never while typing (the date picker fires input on every digit).
function bindMonthRegroup(tbody, lookup, rerender) {
    tbody.addEventListener("focusout", (e) => {
        if (!e.target.matches('input[type="date"]')) return;
        const tr = e.target.closest("tr");
        const item = tr && lookup(tr.dataset.id);
        if (item && monthKey(item.date) !== tr.dataset.month) rerender();
    });
}

function revealRow(tbody, id) {
    const tr = tbody.querySelector(`tr[data-id="${id}"]`);
    if (tr) tr.scrollIntoView({ block: "nearest" });
}

// ============================================================
// Rendering
// ============================================================
function rowTemplate(row, index) {
    const tr = document.createElement("tr");
    tr.dataset.id = row.id;

    const amounts = computeAmounts(row);
    const shareOptionsHtml = SHARE_OPTIONS.map(v =>
        `<option value="${v}"${row.share === v ? " selected" : ""}>${v === "" ? "Select" : v}</option>`
    ).join("");

    const hasReceipt = !!row.receiptPath;
    const receiptLabel = hasReceipt ? "view" : "add";
    const receiptTitle = hasReceipt ? `View ${row.receiptName || "receipt"}` : "Upload receipt";

    tr.innerHTML = `
        <td class="sno" data-label="#">${index + 1}</td>
        <td class="date" data-label="Date"><input type="date" data-field="date" value="${row.date || ""}"></td>
        <td class="description" data-label="Description" contenteditable="true" data-field="description"></td>
        <td class="expense" data-label="Amount" contenteditable="true" data-field="expense" inputmode="decimal"></td>
        <td class="share" data-label="Share">
            <select class="share-select" data-field="share">${shareOptionsHtml}</select>
        </td>
        <td class="person" data-label="Manoj">
            <div class="person-cell${row.manojPaid ? " checked" : ""}">
                <input type="checkbox" class="paid-check" data-field="manojPaid"${row.manojPaid ? " checked" : ""} aria-label="Manoj paid">
                <span class="person-amount manoj-amount">${formatMoney(amounts.manoj)}</span>
            </div>
        </td>
        <td class="person" data-label="Praveen">
            <div class="person-cell${row.praveenPaid ? " checked" : ""}">
                <input type="checkbox" class="paid-check" data-field="praveenPaid"${row.praveenPaid ? " checked" : ""} aria-label="Praveen paid">
                <span class="person-amount praveen-amount">${formatMoney(amounts.praveen)}</span>
            </div>
        </td>
        <td class="remark" data-label="Remark" contenteditable="true" data-field="remark"></td>
        <td class="receipt" data-label="Receipt">
            <div class="receipt-cell">
                <button type="button" class="receipt-btn${hasReceipt ? " has-file" : ""}" data-action="receipt" title="${receiptTitle}">${receiptLabel}</button>
                ${hasReceipt ? '<button type="button" class="receipt-remove" data-action="remove-receipt" title="Remove receipt">×</button>' : ""}
            </div>
        </td>
    `;

    tr.querySelector('[data-field="description"]').textContent = row.description || "";
    tr.querySelector('[data-field="expense"]').textContent =
        row.expense === null ? "" : formatMoney(row.expense);
    tr.querySelector('[data-field="remark"]').textContent = row.remark || "";

    return tr;
}

// # | Date | Description (month label) | Expense | Share | Manoj | Praveen | Remark + Receipt
const EXPENSE_MONTH_HEADER = [[3], [1, "expense"], [1], [1, "manoj"], [1, "praveen"], [2]];
const EXPENSE_MONTH_SUMS = {
    expense: items => items.reduce((s, r) => s + (r.expense || 0), 0),
    manoj:   items => items.reduce((s, r) => s + computeAmounts(r).manoj, 0),
    praveen: items => items.reduce((s, r) => s + computeAmounts(r).praveen, 0)
};

function render() {
    const tbody = document.getElementById("expenseBody");
    renderByMonth(tbody, getSortedRows(), rowTemplate, EXPENSE_MONTH_HEADER);
    updateTotals();
    updateSortIndicators();
    applyLockToDom();
}

// Within each month rows follow the header sort; the default is oldest date first.
function getSortedRows() {
    const { key, dir } = sort.key ? sort : { key: "date", dir: 1 };
    const copy = rows.slice();
    copy.sort((a, b) => {
        if (key === "date") {
            return (a.date || "").localeCompare(b.date || "") * dir;
        }
        const aAmt = computeAmounts(a), bAmt = computeAmounts(b);
        const av = key === "manoj" ? aAmt.manoj : aAmt.praveen;
        const bv = key === "manoj" ? bAmt.manoj : bAmt.praveen;
        return (av - bv) * dir;
    });
    return copy;
}

function updateSortIndicators() {
    document.querySelectorAll(".sort-arrow").forEach(el => { el.textContent = ""; });
    if (!sort.key) return;
    const el = document.querySelector(`.sort-arrow[data-for="${sort.key}"]`);
    if (el) el.textContent = sort.dir > 0 ? "▲" : "▼";
}

function updateTotals() {
    let te = 0, tm = 0, tp = 0;
    rows.forEach(r => {
        if (r.expense !== null && r.expense !== undefined) te += r.expense;
        const a = computeAmounts(r);
        tm += a.manoj;
        tp += a.praveen;
    });
    document.getElementById("totalExpense").textContent = formatMoney(te) || ZERO_MONEY;
    document.getElementById("totalManoj").textContent   = formatMoney(tm) || ZERO_MONEY;
    document.getElementById("totalPraveen").textContent = formatMoney(tp) || ZERO_MONEY;
    refreshMonthSums(document.getElementById("expenseBody"), rows, EXPENSE_MONTH_SUMS);
    updateUtilization();
}

function updateRowAmountsDom(tr, row) {
    const a = computeAmounts(row);
    tr.querySelector(".manoj-amount").textContent   = formatMoney(a.manoj);
    tr.querySelector(".praveen-amount").textContent = formatMoney(a.praveen);
    updateTotals();
}

// ============================================================
// Lock
// ============================================================
function applyLockToDom() {
    document.body.classList.toggle("table-locked", locked);
    document.querySelectorAll('#expenseBody td[contenteditable], #investBody td[contenteditable]').forEach(el => {
        el.setAttribute("contenteditable", locked ? "false" : "true");
    });
    document.querySelectorAll('#expenseBody input, #expenseBody select, #investBody input, #investBody select').forEach(el => {
        el.disabled = locked;
    });
    // Receipt "view/add" button stays enabled even when locked so users
    // can still view/download attachments. The click handler refuses to
    // fire the upload path when locked; CSS hides the "add" (no-file)
    // variant so no dead buttons are visible.
    document.querySelectorAll('#expenseBody .receipt-remove, #investBody .row-delete').forEach(el => {
        el.disabled = locked;
    });
    ["btn-add", "btn-add-invest"].forEach(id => {
        const addBtn = document.getElementById(id);
        if (addBtn) addBtn.disabled = locked;
    });

    const btn = document.getElementById("btn-lock");
    if (btn) {
        btn.classList.toggle("unlocked", !locked);
        btn.setAttribute("aria-pressed", String(locked));
        btn.title = locked ? "Click to unlock for editing" : "Click to lock (prevent edits)";
        document.getElementById("lock-label").textContent = locked ? "Locked" : "Unlocked";
    }
}

function toggleLock() {
    if (locked) {
        if (!confirm("Unlock the tracker for editing?")) return;
        locked = false;
    } else {
        locked = true;
    }
    applyLockToDom();
}

// ============================================================
// Mutations
// ============================================================
async function addRow() {
    if (locked) return;
    try {
        showLoading(true);
        const newRow = await insertRow({
            date: todayIso(), description: "", expense: null, share: "",
            manojPaid: false, praveenPaid: false, remark: ""
        });
        rows.push(newRow);
        render();
        revealRow(document.getElementById("expenseBody"), newRow.id);
        toast("Row added", "success");
    } catch (e) {
        toast("Add row failed: " + e.message, "error");
    } finally {
        showLoading(false);
    }
}

function handleCellEdit(tr, field, value) {
    if (locked) return;
    const row = getRow(tr.dataset.id);
    if (!row) return;

    if (field === "expense") {
        row.expense = parseExpense(value);
        scheduleSave(row.id, "expense", row.expense);
    } else if (field === "date") {
        row.date = value || "";
        scheduleSave(row.id, "date", row.date || null);
    } else if (field === "description" || field === "remark") {
        row[field] = value;
        scheduleSave(row.id, field, value);
    } else if (field === "share") {
        row.share = value;
        saveNow(row.id, "share", value);
    }

    if (field === "expense" || field === "share") {
        updateRowAmountsDom(tr, row);
    }
}

// ============================================================
// Tabs
// ============================================================
function switchTab(name) {
    activeTab = name;
    document.querySelectorAll(".tab-btn").forEach(btn => {
        const on = btn.dataset.tab === name;
        btn.classList.toggle("active", on);
        btn.setAttribute("aria-selected", String(on));
    });
    document.getElementById("view-expenses").hidden    = name !== "expenses";
    document.getElementById("view-investments").hidden = name !== "investments";
}

// ============================================================
// Investments tab (date, person name, amount)
// ============================================================
function investmentFromDb(r) {
    return {
        id:     r.id,
        date:   r.invest_date || "",
        person: r.person_name || "",
        amount: r.amount === null ? null : Number(r.amount)
    };
}

function getInvestment(id) { return investments.find(r => r.id === id); }

function todayIso() { return new Date().toLocaleDateString("en-CA"); }  // YYYY-MM-DD, local tz

async function fetchInvestments() {
    const { data, error } = await sb
        .from(INVEST_STORE.table)
        .select("*")
        .order("invest_date", { ascending: true })
        .order("created_at", { ascending: true });
    if (error) throw error;
    return (data || []).map(investmentFromDb);
}

async function insertInvestment(patch) {
    const { data, error } = await sb
        .from(INVEST_STORE.table)
        .insert(toDbPatch(patch, INVEST_STORE.cols))
        .select()
        .single();
    if (error) throw error;
    return investmentFromDb(data);
}

function investmentRowTemplate(inv, index) {
    const tr = document.createElement("tr");
    tr.dataset.id = inv.id;
    tr.innerHTML = `
        <td class="sno" data-label="#">${index + 1}</td>
        <td class="date" data-label="Date"><input type="date" data-field="date" value="${inv.date || ""}"></td>
        <td class="inv-name" data-label="Person">
            <select class="share-select" data-field="person"></select>
        </td>
        <td class="expense" data-label="Amount" contenteditable="true" data-field="amount" inputmode="decimal"></td>
        <td class="row-actions" data-label="Delete">
            <button type="button" class="row-delete" data-action="delete-investment" title="Delete this investment">×</button>
        </td>
    `;
    fillPersonSelect(tr.querySelector('[data-field="person"]'), inv.person);
    tr.querySelector('[data-field="amount"]').textContent =
        inv.amount === null ? "" : formatMoney(inv.amount);
    return tr;
}

// Options are built via the DOM (never HTML strings) so a stored name
// can't inject markup. A saved name outside INVEST_PEOPLE (e.g. typed
// before this was a dropdown) is kept as an extra option, not hidden.
function fillPersonSelect(select, current) {
    const names = [...INVEST_PEOPLE];
    if (current && !names.includes(current)) names.push(current);
    select.add(new Option("Select", ""));
    names.forEach(n => select.add(new Option(n, n)));
    select.value = current || "";
}

// # | Date | Person Name (month label) | Amount | delete
const INVEST_MONTH_HEADER = [[3], [1, "amount"], [1]];
const INVEST_MONTH_SUMS = { amount: items => items.reduce((s, r) => s + (r.amount || 0), 0) };

function sortedInvestments() {
    return investments.slice().sort((a, b) => (a.date || "").localeCompare(b.date || ""));
}

function updateInvestmentTotal() {
    const total = investments.reduce((sum, r) => sum + (r.amount || 0), 0);
    document.getElementById("totalInvested").textContent = formatMoney(total);
    refreshMonthSums(document.getElementById("investBody"), investments, INVEST_MONTH_SUMS);
    updateUtilization();
}

function renderInvestments() {
    const tbody = document.getElementById("investBody");
    if (investments.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No investments yet. Unlock and click "+ Add Investment".</td></tr>';
    } else {
        renderByMonth(tbody, sortedInvestments(), investmentRowTemplate, INVEST_MONTH_HEADER);
    }
    updateInvestmentTotal();
    applyLockToDom();
}

// Never throws: a missing investments table must not take down Expenses.
async function loadInvestments() {
    try {
        investments = await fetchInvestments();
    } catch (e) {
        toast("Investments unavailable (has supabase_setup.sql been run?): " + e.message, "error");
    }
    renderInvestments();
}

async function addInvestment() {
    if (locked) return;
    try {
        showLoading(true);
        const inv = await insertInvestment({ date: todayIso(), person: "", amount: null });
        investments.push(inv);
        renderInvestments();
        revealRow(document.getElementById("investBody"), inv.id);
        toast("Investment added", "success");
    } catch (e) {
        toast("Add investment failed: " + e.message, "error");
    } finally {
        showLoading(false);
    }
}

function handleInvestmentEdit(tr, field, value) {
    if (locked) return;
    const inv = getInvestment(tr.dataset.id);
    if (!inv) return;

    if (field === "amount") {
        inv.amount = parseExpense(value);
        scheduleSave(inv.id, field, inv.amount, INVEST_STORE);
        updateInvestmentTotal();
    } else if (field === "date") {
        inv.date = value || "";
        scheduleSave(inv.id, field, inv.date || null, INVEST_STORE);
    } else if (field === "person") {
        inv.person = value;
        saveNow(inv.id, field, value, INVEST_STORE);
    }
}

async function deleteInvestment(id) {
    if (locked) return;
    if (!confirm("Delete this investment?")) return;
    try {
        showLoading(true);
        const { error } = await sb.from(INVEST_STORE.table).delete().eq("id", id);
        if (error) throw error;
        investments = investments.filter(r => r.id !== id);
        renderInvestments();
        toast("Investment deleted", "success");
    } catch (e) {
        toast("Delete failed: " + e.message, "error");
    } finally {
        showLoading(false);
    }
}

// ============================================================
// Receipt upload / download / remove
// ============================================================
let pendingReceiptRowId = null;

function receiptFilePath(rowId, originalName) {
    const ext = (originalName.match(/\.[a-zA-Z0-9]+$/) || [""])[0];
    return `${rowId}/${Date.now()}${ext}`;
}

async function uploadReceipt(rowId, file) {
    const row = getRow(rowId);
    if (!row) return;
    try {
        showLoading(true);
        // If there was an old receipt, remove it first (best-effort)
        if (row.receiptPath) {
            await sb.storage.from(BUCKET).remove([row.receiptPath]).catch(() => {});
        }
        const path = receiptFilePath(rowId, file.name);
        const { error: upErr } = await sb.storage.from(BUCKET).upload(path, file, {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type || undefined
        });
        if (upErr) throw upErr;

        await updateRowInDb(rowId, { receiptPath: path, receiptName: file.name });
        row.receiptPath = path;
        row.receiptName = file.name;
        render();
        toast("Receipt uploaded", "success");
    } catch (e) {
        toast("Upload failed: " + e.message, "error");
    } finally {
        showLoading(false);
    }
}

async function openReceipt(rowId) {
    const row = getRow(rowId);
    if (!row || !row.receiptPath) return;
    try {
        const { data, error } = await sb.storage.from(BUCKET)
            .createSignedUrl(row.receiptPath, 60 * 5); // 5-minute link
        if (error) throw error;
        window.open(data.signedUrl, "_blank", "noopener");
    } catch (e) {
        toast("Could not open receipt: " + e.message, "error");
    }
}

async function removeReceipt(rowId) {
    if (locked) return;
    const row = getRow(rowId);
    if (!row || !row.receiptPath) return;
    if (!confirm(`Remove receipt "${row.receiptName || ""}"?`)) return;
    try {
        showLoading(true);
        await sb.storage.from(BUCKET).remove([row.receiptPath]).catch(() => {});
        await updateRowInDb(rowId, { receiptPath: null, receiptName: null });
        row.receiptPath = null;
        row.receiptName = null;
        render();
        toast("Receipt removed", "success");
    } catch (e) {
        toast("Remove failed: " + e.message, "error");
    } finally {
        showLoading(false);
    }
}

// ============================================================
// Events
// ============================================================
function bindEvents() {
    mountUtilization();
    updateUtilization();
    document.getElementById("btn-add").addEventListener("click", addRow);
    document.getElementById("btn-export").addEventListener("click", () => {
        if (activeTab === "investments") exportInvestmentsCSV(); else exportCSV();
    });
    document.getElementById("btn-print").addEventListener("click", () => window.print());
    document.getElementById("btn-lock").addEventListener("click", toggleLock);
    document.getElementById("btn-logout").addEventListener("click", handleLogout);

    // Sortable headers
    document.querySelectorAll("thead th.sortable").forEach(th => {
        th.addEventListener("click", () => {
            const key = th.dataset.sort;
            sort = sort.key === key ? { key, dir: -sort.dir } : { key, dir: 1 };
            render();
        });
    });

    const tbody = document.getElementById("expenseBody");

    tbody.addEventListener("input", (e) => {
        const t = e.target;
        const tr = t.closest("tr");
        if (!tr) return;
        const field = t.dataset.field;
        if (!field) return;

        if (t.matches('[contenteditable="true"]')) {
            handleCellEdit(tr, field, t.textContent);
        } else if (t.matches('input[type="date"]')) {
            handleCellEdit(tr, field, t.value);
        }
    });

    bindMoneyCells(tbody, "expense", getRow);
    bindMonthRegroup(tbody, getRow, render);

    tbody.addEventListener("change", (e) => {
        const t = e.target;
        const tr = t.closest("tr");
        if (!tr) return;
        const field = t.dataset.field;
        if (!field) return;

        if (t.matches("select")) {
            handleCellEdit(tr, field, t.value);
        } else if (t.matches('input[type="checkbox"]')) {
            const row = getRow(tr.dataset.id);
            if (!row) return;
            row[field] = t.checked;
            t.closest(".person-cell").classList.toggle("checked", t.checked);
            updateUtilization();   // a tick moves that share into "Utilized"
            saveNow(row.id, field, t.checked);
        } else if (t.matches('input[type="date"]')) {
            handleCellEdit(tr, field, t.value);
        }
    });

    // Receipt buttons
    tbody.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;
        const tr = btn.closest("tr");
        if (!tr) return;
        const rowId = tr.dataset.id;
        const action = btn.dataset.action;

        if (action === "receipt") {
            const row = getRow(rowId);
            if (!row) return;
            if (row.receiptPath) {
                openReceipt(rowId);
            } else {
                if (locked) return;
                pendingReceiptRowId = rowId;
                document.getElementById("file-input").click();
            }
        } else if (action === "remove-receipt") {
            removeReceipt(rowId);
        }
    });

    document.getElementById("file-input").addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = "";  // reset so same file can be picked again
        if (!file || !pendingReceiptRowId) return;
        const id = pendingReceiptRowId;
        pendingReceiptRowId = null;
        uploadReceipt(id, file);
    });

    bindPasteSanitizer(tbody);

    // Tabs
    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });
    bindInvestmentEvents();
}

// Paste plain text only into editable cells (no rich-text junk)
function bindPasteSanitizer(tbody) {
    tbody.addEventListener("paste", (e) => {
        const t = e.target;
        if (!t.matches || !t.matches('[contenteditable="true"]')) return;
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData("text/plain");
        document.execCommand("insertText", false, text);
    });
}

// Money cells: bare number while editing, ₹-formatted otherwise, and
// only digits / one decimal point may be typed. `field` is both the
// data-field name and the record property holding the number.
function bindMoneyCells(tbody, field, lookup) {
    const selector = `[data-field="${field}"][contenteditable="true"]`;
    const recordFor = (cell) => lookup(cell.closest("tr").dataset.id);

    tbody.addEventListener("blur", (e) => {
        const t = e.target;
        if (t.matches && t.matches(selector)) {
            const rec = recordFor(t);
            if (rec) t.textContent = rec[field] === null ? "" : formatMoney(rec[field]);
        }
    }, true);

    tbody.addEventListener("focus", (e) => {
        const t = e.target;
        if (t.matches && t.matches(selector)) {
            const rec = recordFor(t);
            if (rec && rec[field] !== null) t.textContent = String(rec[field]);
        }
    }, true);

    tbody.addEventListener("keydown", (e) => {
        const t = e.target;
        if (!t.matches || !t.matches(selector)) return;
        const allowed = ["Backspace","Delete","ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Tab","Home","End","Enter"];
        if (allowed.includes(e.key)) return;
        if (e.ctrlKey || e.metaKey) return;
        if (/^[0-9]$/.test(e.key)) return;
        if (e.key === "." && !t.textContent.includes(".")) return;
        e.preventDefault();
    });
}

function bindInvestmentEvents() {
    document.getElementById("btn-add-invest").addEventListener("click", addInvestment);
    const tbody = document.getElementById("investBody");

    const onEdit = (e) => {
        const t = e.target;
        const tr = t.closest("tr");
        const field = t.dataset.field;
        if (!tr || !field) return;
        if (t.matches('input[type="date"], select')) {
            handleInvestmentEdit(tr, field, t.value);
        } else if (t.matches('[contenteditable="true"]') && e.type === "input") {
            handleInvestmentEdit(tr, field, t.textContent);
        }
    };
    tbody.addEventListener("input", onEdit);
    tbody.addEventListener("change", onEdit);   // some browsers only fire change for date pickers

    tbody.addEventListener("click", (e) => {
        const btn = e.target.closest('button[data-action="delete-investment"]');
        if (btn) deleteInvestment(btn.closest("tr").dataset.id);
    });

    bindMoneyCells(tbody, "amount", getInvestment);
    bindMonthRegroup(tbody, getInvestment, renderInvestments);
    bindPasteSanitizer(tbody);
}

// ============================================================
// CSV Export
// ============================================================
function csvEscape(s) {
    if (s === null || s === undefined) return "";
    const str = String(s);
    return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
}

function exportCSV() {
    const header = ["S.No.","Date","Description","Expense","Share","Manoj","Manoj Paid","Praveen","Praveen Paid","Remark","Receipt"];
    const lines = [header.map(csvEscape).join(",")];
    getSortedRows().forEach((r, i) => {   // same order as on screen
        const a = computeAmounts(r);
        lines.push([
            i + 1,
            r.date || "",
            r.description || "",
            r.expense === null ? "" : r.expense,
            r.share || "",
            roundCents(a.manoj) || "",
            r.manojPaid ? "Yes" : "",
            roundCents(a.praveen) || "",
            r.praveenPaid ? "Yes" : "",
            r.remark || "",
            r.receiptName || ""
        ].map(csvEscape).join(","));
    });
    let te = 0, tm = 0, tp = 0;
    rows.forEach(r => {
        if (r.expense !== null && r.expense !== undefined) te += r.expense;
        const a = computeAmounts(r);
        tm += a.manoj; tp += a.praveen;
    });
    lines.push(["","","GRAND TOTAL", roundCents(te), "", roundCents(tm), "", roundCents(tp), "", "", ""].map(csvEscape).join(","));

    downloadCsv(lines, "PearlFox_Expenses");
}

function exportInvestmentsCSV() {
    const lines = [["S.No.","Date","Person Name","Amount"].map(csvEscape).join(",")];
    let total = 0;
    sortedInvestments().forEach((r, i) => {
        total += r.amount || 0;
        lines.push([i + 1, r.date || "", r.person || "", r.amount === null ? "" : r.amount]
            .map(csvEscape).join(","));
    });
    lines.push(["", "", "TOTAL INVESTED", roundCents(total)].map(csvEscape).join(","));
    downloadCsv(lines, "PearlFox_Investments");
}

function downloadCsv(lines, baseName) {
    const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `${baseName}_${stamp}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

// ============================================================
// Auth
// ============================================================
async function handleLogin() {
    const password = document.getElementById("login-password").value;
    const errorEl = document.getElementById("login-error");
    const btn = document.getElementById("btn-login");

    errorEl.textContent = "";
    if (!password) {
        errorEl.textContent = "Enter password";
        return;
    }

    btn.disabled = true;
    btn.textContent = "Unlocking…";
    try {
        const { error } = await sb.auth.signInWithPassword({ email: LOGIN_EMAIL, password });
        if (error) throw error;
        await enterApp();
    } catch (e) {
        // Supabase says "Invalid login credentials" — clarify for our UX
        errorEl.textContent = (e.message || "").toLowerCase().includes("invalid")
            ? "Incorrect password"
            : (e.message || "Sign-in failed");
    } finally {
        btn.disabled = false;
        btn.textContent = "Unlock";
    }
}

async function handleLogout() {
    if (!confirm("Sign out?")) return;
    try {
        await sb.auth.signOut();
    } catch (e) { /* ignore */ }
    location.reload();
}

async function enterApp() {
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("app").classList.add("ready");
    showLoading(true);
    try {
        rows = await fetchRows();
        if (rows.length === 0) {
            // First-time setup: seed default blank rows so the sheet
            // is usable immediately instead of an empty grid.
            await seedDefaultRows(DEFAULT_ROWS);
            rows = await fetchRows();
        }
        render();
        await loadInvestments();
    } catch (e) {
        toast("Failed to load data: " + e.message, "error");
    } finally {
        showLoading(false);
    }
}

// ============================================================
// Boot
// ============================================================
(async function init() {
    document.getElementById("btn-login").addEventListener("click", handleLogin);
    document.getElementById("login-password").addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleLogin();
    });

    bindEvents();

    // Restore session if any
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
        await enterApp();
    }
})();
</script>
