<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17382C">
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="../favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="96x96" href="../favicon-96x96.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">
<link rel="manifest" href="../site.webmanifest">
<link rel="stylesheet" href="l4u.css">
<title>Course - Learn4U</title>
</head>
<body>
<div class="app">
<aside id="topbar"></aside>
<main class="main" id="main">
  <nav class="mailbar" data-course-page aria-label="Mail">
    <a class="btn-secondary btn-sm" id="mailNew" href="mailto:" title="Open a new mail: this training assigned"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg><span>New</span></a>
    <a class="btn-secondary btn-sm" id="mailDone" href="mailto:" title="Open a new mail: this training completed"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg><span>Completed</span></a>
  </nav>
  <div id="view"></div>
  <footer id="sitefoot"></footer>
</main>
</div>
<div class="overlay" id="certOverlay" hidden>
  <div class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="certTitle">
    <div class="dialog-head"><h2 id="certTitle">Certificate of completion</h2><button type="button" class="x" id="certClose" aria-label="Close">&times;</button></div>
    <div class="dialog-body" id="certPrint"></div>
    <div class="dialog-foot"><button type="button" class="btn-secondary" id="certDone">Close</button><button type="button" class="btn-primary" id="certPrintBtn">Print</button></div>
  </div>
</div>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="mail-copy.js"></script>
<script src="course.js"></script>
<script src="mail-link.js"></script>
</body>
</html>
