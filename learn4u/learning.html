<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17382C">
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="../favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="96x96" href="../favicon-96x96.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">
<link rel="manifest" href="../site.webmanifest">
<link rel="stylesheet" href="l4u.css">
<title>My learning - Learn4U</title>
</head>
<body>
<div class="app">
<aside id="topbar"></aside>
<main class="main" id="main">
  <div class="head"><div><span class="eyebrow">My learning</span><h1>Everything on your plate</h1><p>What is assigned to you, and what you chose to take.</p></div>
    <button type="button" class="testbtn" id="assignBtn" aria-haspopup="dialog" title="Test tool for this preview">+ Assign training (test)</button></div>
  <div class="bar2">
    <div class="pills" role="tablist" id="tabs" aria-label="Filter trainings"></div>
    <div class="search" style="min-width:230px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><label class="sr" for="q">Search my learning</label><input id="q" type="search" placeholder="Search my learning" autocomplete="off"></div>
  </div>
  <ul class="lcards" id="rows"></ul>
  <div id="none" class="empty" hidden><strong>Nothing here</strong><span id="noneText"></span></div>
  <p class="hint" style="margin-top:18px">Assign training is a test tool for this preview: it adds a course to your list so you can try the mails and the Eagle View app.</p>
  <footer id="sitefoot"></footer>
</main>
</div>
<div class="overlay" id="assignOverlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="assignTitle">
    <div class="dialog-head"><h2 id="assignTitle">Assign a training</h2><button type="button" class="x" id="assignClose" aria-label="Close">&times;</button></div>
    <form id="assignForm" novalidate><div class="dialog-body">
      <div class="field"><label for="aCourse">Course</label><select id="aCourse"></select><span class="note" id="aNote"></span></div>
      <div class="field"><label for="aType">Type</label><select id="aType"><option value="mandatory">Mandatory</option><option value="optional">Optional</option></select></div>
      <div class="field"><label for="aDue">Due date</label><input id="aDue" type="date"></div>
    </div>
    <div class="dialog-foot"><button type="button" class="btn-secondary" id="aRandom">Random</button><button type="button" class="btn-secondary" id="aCancel">Cancel</button><button type="submit" class="btn-primary">Assign</button></div></form>
  </div>
</div>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="learning.js"></script>
</body>
</html>
