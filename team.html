<!-- =======================================================================
     TEAM — the people behind PearlFox.
     Cards without a photo show just the name and role (no placeholder).
     To add a photo, put this at the top of the <figure class="team-card">:
         <div class="team-photo is-color">
           <img src="team-photos/name.webp" alt="Name, Role" width="480" height="480" loading="lazy" decoding="async">
         </div>
     (480x480 square webp; drop "is-color" for grayscale-until-hover.)
     ======================================================================= -->
<section class="team" id="team" style="padding-top:56px">
  <div class="wrap">

    <!-- Row 1 · Leadership -->
    <div class="team-tier">
      <div class="team-tier-label"><span>Leadership</span></div>
      <div class="team-row team-row-2">
        <figure class="team-card">
          <div class="team-photo is-color"><img src="team-photos/nevedha.webp" alt="Nevedha, Chief Executive Officer" width="480" height="480" loading="lazy" decoding="async"></div>
          <figcaption>
            <h3 class="team-name">Nevedha</h3>
            <div class="team-role">Chief Executive Officer</div>
          </figcaption>
        </figure>
        <figure class="team-card">
          <div class="team-photo is-color"><img src="team-photos/monisha.webp" alt="Monisha Praveen, Chief Technology Officer" width="480" height="480" loading="lazy" decoding="async"></div>
          <figcaption>
            <h3 class="team-name">Monisha Praveen</h3>
            <div class="team-role">Chief Technology Officer</div>
          </figcaption>
        </figure>
      </div>
    </div>

    <!-- Row 2 · Core Team -->
    <div class="team-tier">
      <div class="team-tier-label"><span>Core Team</span></div>
      <div class="team-row team-row-2">
        <figure class="team-card">
          <figcaption>
            <h3 class="team-name">MK</h3>
            <div class="team-role">Lead Developer &amp; Architect</div>
          </figcaption>
        </figure>
        <figure class="team-card">
          <figcaption>
            <h3 class="team-name">Sowbaranika Raman</h3>
            <div class="team-role">Lead Test Engineer</div>
          </figcaption>
        </figure>
      </div>
    </div>

    <!-- Row 3 · Marketing -->
    <div class="team-tier">
      <div class="team-tier-label"><span>Marketing</span></div>
      <div class="team-row team-row-2">
        <figure class="team-card">
          <figcaption>
            <h3 class="team-name">Rokesh</h3>
            <div class="team-role">Marketing Head</div>
          </figcaption>
        </figure>
      </div>
    </div>

    <!-- Row 4 · Mentors & Advisors -->
    <div class="team-tier">
      <div class="team-tier-label"><span>Mentors &amp; Advisors</span></div>
      <div class="team-row team-row-4">
        <figure class="team-card">
          <figcaption>
            <h3 class="team-name">Praveen Magesh</h3>
            <div class="team-role">Product Mentor</div>
          </figcaption>
        </figure>
        <figure class="team-card">
          <figcaption>
            <h3 class="team-name">Rajesh Baskar</h3>
            <div class="team-role">Strategy Advisor</div>
          </figcaption>
        </figure>
        <figure class="team-card">
          <figcaption>
            <h3 class="team-name">Sindhu Nandhu</h3>
            <div class="team-role">Growth Mentor</div>
          </figcaption>
        </figure>
        <figure class="team-card">
          <figcaption>
            <h3 class="team-name">Anitha Rajesh</h3>
            <div class="team-role">Engineering Advisor</div>
          </figcaption>
        </figure>
      </div>
    </div>
  </div>
